<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto clicker mouse : Customer Product Reviews</title>
    <link rel="stylesheet" href="css/review.css">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script defer src="js/review.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>Reviews</h1>
			<button id="HomeButton" 	class="custom-button" onclick="window.location.href='/';">Home</button>
			<button id="MyOrdersButton" class="custom-button" onclick="redirectToHome()">My Orders</button>			
			<script>
				function redirectToHome() {
					localStorage.setItem('openOrdersPopup', 'true'); // Set flag to open the popup
					window.location.href = '/'; // Redirect to home page
				}
			</script>
			<button id="FAQsButton" 	class="custom-button" onclick="window.location.href='/FAQs';">FAQs</button>
        </header>

        <section id="reviews-container">
            <p class="loading">Loading reviews...</p>
        </section>

    </div>

<!-- Modal Structure -->
<div id="details-modal" class="modal">
    <div id="modal-content" class="modal-content">
        <!-- Order details will be inserted here -->
    </div>
</div>
<div id="pagination-container" class="pagination-container">
    <!-- Pagination buttons will be dynamically added here -->
</div>




</body>
</html>
