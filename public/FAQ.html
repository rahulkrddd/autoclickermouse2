<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Auto Clicker Mouse FAQ - Get all your questions answered!">
    <title>Auto Clicker Mouse - Frequently Asked Questions</title>
    <link rel="stylesheet" href="/css/FAQ.css">
</head>
<body>

    <!-- Navigation Bar -->
    <header>
        <nav class="navbar">
            <div class="logo">
                <h1 class="faq-title">FAQ Page</h1>
            </div>
            <ul class="nav-links">
                <li><a href="/">Home</a></li>
                <li><a href="#faq">FAQ</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- FAQ Section -->
    <section id="faq" class="faq-section">
        <div class="container">
            <h2 class="section-title">Frequently Asked Questions</h2>

            <!-- Search Bar -->
<div class="faq-search-container">
    <input type="text" id="faq-search" placeholder="Search FAQs..." onkeyup="filterFAQ()">
    <div class="faq-category-filter">
        <select id="category-select" onchange="filterByCategory(this.value)">
            <option value="All">All Categories</option>
            <option value="General">General</option>
            <option value="Payment">Payment</option>
            <option value="Dispatch">Dispatch</option>
            <option value="Delivery">Delivery</option>
            <option value="Services">Services</option>
        </select>
    </div>
</div>




            <!-- FAQ Container (Populated Dynamically) -->
            <div id="faq-content"></div>
        </div>
    </section>

    <!-- Contact Section -->
    <section id="contact" class="contact-section">
		<div class="contact-section-wrapper">
			<h2 class="contact-title">Get in Touch</h2>
			<p class="contact-text">If you have more questions or need support, feel free to contact us. We're here to help!</p>
			<a href="tel:+918839623805" class="contact-button">Contact Support</a>
		</div>
		
    </section>

    <!-- Footer -->
    <footer class="footer">
        <p>&copy; <span id="year"></span> AutoClicker Mouse | All Rights Reserved</p>
    </footer>

    <script>
        // Auto-update the year in the footer
        document.getElementById("year").textContent = new Date().getFullYear();
    </script>

    <script src="/js/FAQ.js"></script>
</body>
</html>
